name: Build and release WordPress theme

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Validate PHP syntax
        shell: bash
        run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Verify release version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(awk -F': ' '/^Version:/{print $2; exit}' style.css | tr -d '\r')"
          test "$TAG" = "$VERSION"

      - name: Build WordPress-ready ZIP
        shell: bash
        run: |
          VERSION="$(awk -F': ' '/^Version:/{print $2; exit}' style.css | tr -d '\r')"
          mkdir -p dist/package/wp-dev-theme
          rsync -a --exclude='.git' --exclude='.github' --exclude='dist' --exclude='build-release.sh' ./ dist/package/wp-dev-theme/
          (cd dist/package && zip -qr "../wp-dev-theme-${VERSION}.zip" wp-dev-theme)

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/wp-dev-theme-*.zip
